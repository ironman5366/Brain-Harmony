[project]
name = "brainharmonix"
version = "0.1.0"
dependencies = [
    "datasets>=4.4.1",
    "fmri-fm-eval",
]

[tool.setuptools.packages.find]
include = ["modules*", "configs*", "libs*", "brain_datasets*", "checkpoints*", "experiments*"]  # 只包含 modules 和 configs
exclude = [
    "tests*", 
    "*.pyc", 
    "__pycache__",
]

[tool.uv.sources]
fmri-fm-eval = { git = "https://github.com/MedARC-AI/fmri-fm-eval.git" }
